<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube Transcript</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="container">
    <div class="header">
      <div class="header-titles">
        <h1>YouTube Transcript</h1>
        <p class="subtitle">Paste a YouTube video URL to get its caption transcript.</p>
      </div>
      <button id="logs-toggle" class="btn btn-quiet" type="button">Show logs</button>
    </div>

    <form id="fetch-form" class="row">
      <input
        id="url-input"
        class="url-input"
        type="text"
        inputmode="url"
        placeholder="https://www.youtube.com/watch?v=…"
        autocomplete="off"
        spellcheck="false"
        aria-label="YouTube video URL"
      />
      <button id="fetch-btn" class="btn" type="submit">
        <span id="fetch-spinner" class="spinner" hidden aria-hidden="true"></span>
        <span id="fetch-label">Fetch transcript</span>
      </button>
    </form>

    <div id="error-banner" class="error-banner" role="alert" hidden></div>

    <section id="result" hidden>
      <div class="result-header">
        <div class="result-meta">
          <h2 id="video-title" class="video-title"></h2>
          <span id="video-language" class="video-language"></span>
        </div>
        <div class="result-actions">
          <button id="copy-btn" class="btn" disabled>Copy transcript</button>
          <button id="download-btn" class="btn" disabled>Download</button>
          <select id="provider-picker" class="provider-picker"
                  aria-label="Summarization provider and model" disabled></select>
          <button id="summarize-btn" class="btn" type="button" disabled>
            <span id="summarize-spinner" class="spinner" hidden aria-hidden="true"></span>
            <span id="summarize-label">Summarize</span>
          </button>
        </div>
      </div>
      <pre id="transcript-panel" class="transcript-panel" tabindex="0"></pre>
      <section id="summary-panel" class="summary-panel" hidden aria-label="Summary">
        <div class="summary-header">
          <h3 class="summary-title">Summary</h3>
          <button id="summary-copy-btn" class="btn btn-quiet" type="button" disabled>
            Copy summary
          </button>
        </div>
        <pre id="summary-text" class="summary-text" tabindex="0"></pre>
      </section>
    </section>

    <section id="saved" class="saved-section" aria-labelledby="saved-title">
      <div class="saved-header">
        <h2 id="saved-title" class="saved-title">
          Saved transcripts <span id="saved-count" class="saved-count"></span>
        </h2>
        <button id="saved-refresh-btn" class="btn btn-quiet" type="button">
          Refresh
        </button>
      </div>
      <ul id="saved-list" class="saved-list" hidden></ul>
      <p id="saved-empty" class="saved-empty" hidden>No transcripts saved yet.</p>
    </section>

    <pre id="log-panel" class="log-panel" hidden tabindex="0" aria-label="Server log"></pre>
  </main>
  <script src="/app.js"></script>
</body>
</html>
