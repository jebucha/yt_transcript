[project]
name = "yt-transcript"
version = "0.3.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "structlog==26.1.0",
    "youtube-transcript-api==1.2.4",
    "yt-dlp==2026.10.26",
    # imported directly by app/fetchers.py (also a yt-dlp dependency)
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    # required by starlette's TestClient in the API/logging tests
    "httpx==0.28.1",
    # e2e only: `python -m playwright install chromium` (one-time)
    "playwright==1.64.1",
]
